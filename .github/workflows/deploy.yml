name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Previously published full SHA to deploy (defaults to main HEAD)
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # Runs the same quality gate and production-path E2E that every PR gets.
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.component }}
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: infra/api.Dockerfile
            image: ghcr.io/joelitooo/portfolio-api
          - component: web
            dockerfile: infra/web.Dockerfile
            image: ghcr.io/joelitooo/portfolio-web
    steps:
      - name: Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure web build arguments
        if: matrix.component == 'web'
        env:
          UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID || secrets.VITE_UMAMI_WEBSITE_ID }}
        run: |
          if [ -z "${UMAMI_WEBSITE_ID}" ]; then
            echo "::error::VITE_UMAMI_WEBSITE_ID is not set in the production environment; the web image would ship without analytics."
            exit 1
          fi

          {
            echo "WEB_BUILD_ARGS<<EOF"
            echo "VITE_API_URL=https://api.joelitoo.com"
            echo "VITE_UMAMI_URL=https://analytics.joelitoo.com"
            echo "VITE_UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ env.WEB_BUILD_ARGS }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy to Pi
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: [self-hosted, linux, ARM64, portfolio-pi]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out trusted main workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy immutable images
        # The dispatch input reaches the shell as data, never as command text:
        # this job runs on the Pi, where injected commands would be privileged.
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha || github.sha }}
        run: infra/scripts/deploy.sh "$DEPLOY_SHA"

  smoke:
    name: Public smoke checks
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public health endpoints
        run: |
          test "$(curl --fail --show-error --silent --retry 5 --retry-delay 5 https://joelitoo.com/healthz)" = "ok"
          curl --fail --show-error --silent --retry 5 --retry-delay 5 https://api.joelitoo.com/health |
            grep --fixed-strings --quiet '"status":"ok"'
          curl --fail --show-error --silent --retry 5 --retry-delay 5 https://api.joelitoo.com/ping |
            grep --fixed-strings --quiet 'pong'
